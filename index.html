<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05070b"><title>BTC Analysis Terminal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05070b;color:#d9e2ee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
main{max-width:1040px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1b2532;padding:8px 2px 13px}.brand{font:800 21px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;letter-spacing:.3px}.live{font-size:10px;color:#6df0a5}.card{background:#0a0f16;border:1px solid #1b2634;border-radius:10px;padding:13px;margin:11px 0;box-shadow:0 8px 28px #0007}h2{font:800 13px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;margin:0 0 9px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.stat{background:#070b11;border:1px solid #17212d;border-radius:7px;padding:9px}.sub{color:#637286;font-size:9px}.num{font-size:18px;font-weight:800;margin-top:4px}.green{color:#69e6a0}.blue{color:#77aaff}.amber{color:#f0b354}.red{color:#ff6876}.console{height:335px;background:#020407;border:1px solid #15202c;border-radius:7px;padding:11px;overflow:auto;font-size:10px;line-height:1.75}.line{white-space:nowrap}.dim{color:#536276}.cyan{color:#72d9ff}.ok{color:#72e5a1}.warn{color:#f0b354}.bar{height:6px;background:#141d27;border-radius:7px;overflow:hidden}.fill{height:100%;width:0;background:#6da5ff}.meter{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.meter b{display:block;font-size:9px;color:#718096;margin-bottom:4px}button{width:100%;padding:13px;border:0;border-radius:7px;background:#245ee8;color:white;font-weight:800;letter-spacing:.8px;margin-top:10px}button:disabled{opacity:.55}.row{display:flex;justify-content:space-between;border-bottom:1px solid #151e29;padding:7px 0;font-size:10px}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:9px}th,td{text-align:left;padding:6px;border-bottom:1px solid #151e29;word-break:break-all}th{color:#65748a}.hash{color:#8c9aad}.candidate{color:#b8c7d9}@media(max-width:760px){.grid{grid-template-columns:repeat(3,1fr)}.brand{font-size:17px}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.console{height:300px}}
</style>
</head>
<body><main>
<div class="top"><div class="brand">₿ BTC ANALYSIS TERMINAL</div><div class="live">● ENGINE ONLINE</div></div>

<div class="card"><h2>LIVE TELEMETRY</h2>
<div class="grid">
<div class="stat"><span class="sub">BLOCK</span><div class="num" id="height">—</div></div>
<div class="stat"><span class="sub">TX</span><div class="num blue" id="tx">0</div></div>
<div class="stat"><span class="sub">OUTPUTS</span><div class="num amber" id="utxo">0</div></div>
<div class="stat"><span class="sub">ADDRESSES</span><div class="num green" id="addr">0</div></div>
<div class="stat"><span class="sub">RATE</span><div class="num" id="rate">0/s</div></div>
<div class="stat"><span class="sub">ELAPSED</span><div class="num" id="elapsed">00:00</div></div>
</div></div>

<div class="card"><h2>CRYPTO ANALYSIS ENGINE</h2>
<div class="console" id="console"></div>
<div class="meter"><div><b>PROCESS</b><div class="bar"><div id="pfill" class="fill"></div></div></div><div><b>CHECKPOINT</b><div class="bar"><div id="cfill" class="fill"></div></div></div></div>
<button id="run">START ANALYSIS</button></div>

<div class="card"><h2>RUNTIME STATUS</h2>
<div class="row"><span>Candidate sequences</span><b id="candidates">0</b></div>
<div class="row"><span>Ranges processed</span><b id="ranges">0</b></div>
<div class="row"><span>Checks completed</span><b id="checks">0</b></div>
<div class="row"><span>Active workers</span><b class="green">8</b></div>
</div>

<div class="card"><h2>OBSERVED OUTPUTS</h2><div class="wrap"><table><thead><tr><th>ADDRESS</th><th>TX</th><th>VALUE</th></tr></thead><tbody id="out"></tbody></table></div></div>
</main>
<script>
const API='https://blockstream.info/api',$=id=>document.getElementById(id),seen=new Map(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(p){const r=await fetch(API+p,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function render(){$('addr').textContent=seen.size;$('out').innerHTML=[...seen].slice(0,100).map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1].id)+'</td><td>'+x[1].value+' sats</td></tr>').join('')}
function shortHex(n=12){let s='';const h='0123456789ABCDEF';for(let i=0;i<n;i++)s+=h[Math.floor(Math.random()*16)];return s}
function addLog(cls,msg){const c=$('console');const t=new Date().toLocaleTimeString('en-GB',{hour12:false});c.innerHTML+='<div class="line"><span class="dim">['+t+']</span> <span class="'+cls+'">'+msg+'</span></div>';c.scrollTop=c.scrollHeight}
async function liveScan(){try{const h=Number(await fetch(API+'/blocks/tip/height').then(r=>r.text()));$('height').textContent=h.toLocaleString();const hash=await fetch(API+'/block-height/'+h).then(r=>r.text()),ids=await api('/block/'+hash+'/txids');let n=0,u=0;for(const id of ids.slice(0,35)){const t=await api('/tx/'+id);n++;for(const v of(t.vout||[])){if(v.scriptpubkey_address){u++;seen.set(v.scriptpubkey_address,{id,value:v.value})}}}$('tx').textContent=n;$('utxo').textContent=u;render()}catch(e){addLog('warn','NETWORK RETRY '+e.message)}}
let running=false,start=0;
async function engine(){if(running)return;running=true;$('run').disabled=true;start=Date.now();$('console').innerHTML='';
const stages=['INITIALIZING HASH PIPELINE','ALLOCATING WORKERS','BUILDING CANDIDATE RANGES','DERIVATION CHECKPOINT','HASH STREAM ACTIVE','CORRELATION PASS','CHECKSUM VERIFICATION','FINAL CHECKPOINT'];
for(let i=0;i<stages.length;i++){
await sleep(360);
addLog('cyan',stages[i]+'  ::  '+shortHex(8)+'-'+shortHex(8));
addLog('candidate','candidate '+shortHex(6)+'...  range='+shortHex(4)+'-'+shortHex(4)+'  score='+Math.floor(100+Math.random()*900));
$('pfill').style.width=((i+1)/stages.length*100)+'%';$('cfill').style.width=(15+i*11)+'%';
$('rate').textContent=(12+Math.floor(Math.random()*8))+'M/s';
$('candidates').textContent=(1200+i*731+Math.floor(Math.random()*400)).toLocaleString();
$('ranges').textContent=(80+i*43).toLocaleString();
$('checks').textContent=(24000+i*17000).toLocaleString();
}
addLog('ok','ANALYSIS CHECKPOINT COMPLETE  ::  '+shortHex(16));
addLog('dim','SESSION '+shortHex(12)+'  /  '+new Date().toISOString());
running=false;$('run').disabled=false}
setInterval(()=>{if(start)$('elapsed').textContent=new Date(Date.now()-start).toISOString().substr(14,5)},1000);
$('run').onclick=engine;liveScan();setInterval(liveScan,30000);
</script></body></html>
